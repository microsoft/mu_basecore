# Runs QEMU-based platform validation on pull requests.
#
# Triggered directly by pull requests targeting the test validation branch.
#
# Gathers PR metadata and calls the reusable MuPrValidation workflow in
# mu_devops to build and boot mu_basecore changes on QEMU Q35 and SBSA.
#
# Copyright (c) Microsoft Corporation.
# SPDX-License-Identifier: BSD-2-Clause-Patent
##
name: KVM Validation Test

on:
  pull_request:
    branches: [test_validation_target]

concurrency:
  group: kvm-validation-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  qemu-pr-validation:
    name: Run Mu QEMU Validation
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: microsoft/mu_devops/.github/workflows/MuPrValidation.yml@kvm_q35
    with:
      app-id: ${{ vars.MU_ACCESS_APP_ID }}
      caller-ref: ${{ github.event.pull_request.head.sha }}
      caller-repo: ${{ github.event.pull_request.head.repo.full_name }}
      caller-repo-name: mu_basecore
      head-sha: ${{ github.event.pull_request.head.sha }}
      pr-number: ${{ github.event.pull_request.number }}
      submodule-path: MU_BASECORE
    secrets:
      private-key: ${{ secrets.MU_ACCESS_APP_PRIVATE_KEY }}
