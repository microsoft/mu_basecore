name: Update BaseTools external dependency

on:
  workflow_call:
    inputs:
      tag_name:
        description: 'The Tag name of the release, e.g., v2025020000.0.2'
        required: true
        type: string
      github_token:
        description: 'GitHub token for authentication'
        required: true
        type: string
  
env:
  BASETOOLS_PATH: BaseTools/Bin/basetoolsbin_ext_dep.yaml
  ARTIFACT_BASE_URL: https://github.com/microsoft/mu_basecore/releases/download

jobs:
  update-basetools:
    name: Update BaseTools External Dependency
    runs-on: ubuntu-latest

    steps:
      - name: Determine Branch
        shell: bash
        id: branch
        run: |
          # Example: dev-v2025020000.0.2
          RELEASE_NAME="${{ inputs.tag_name }}"
          URL_PREFIX="${{ env.ARTIFACT_BASE_URL }}"
          
          echo "Release tag name: ${RELEASE_NAME}"

          # release builds do not have "release" in their tag name
          if [[ ${RELEASE_NAME} == release* ]]; then
            echo "Detected release branch."
            IS_RELEASE=true
          else
            IS_RELEASE=false
          fi

          DATE=$(echo "$RELEASE_NAME" | sed -E 's/.*-v([0-9]{6}).*/\1/')

          if [[ ${IS_RELEASE} == true ]]; then
            BRANCH_NAME="release/${DATE}"
          else
            BRANCH_NAME="dev/${DATE}"
          fi

          echo "Branch name: ${BRANCH_NAME}"
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT

          SOURCE_URL=${URL_PREFIX}/${RELEASE_NAME}/basetools-${RELEASE_NAME}.tar.gz
          echo "Release URL: ${SOURCE_URL}"
          echo "source_url=${SOURCE_URL}" >> $GITHUB_OUTPUT

          VERSION=${RELEASE_NAME}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.branch_name }}

      - name: Download dependencies
        shell: bash
        run: |
          sudo apt install jq moreutils -y
    
      - name: Update BaseTools External Dependency
        shell: bash
        run: |
          PATH="${{ env.BASETOOLS_PATH }}"
          SOURCE="${{ steps.branch.outputs.source_url }}"
          VERSION="${{ steps.branch.outputs.version }}"
          SHA256=$(curl -sSL "${SOURCE}" | sha256sum | awk '{print $1}')
          
          jq '.source = "${SOURCE}" | .version = "${VERSION}" | .sha256 = "${SHA256}"' ${PATH} | sponge ${PATH}
      
      - name: Commit and push changes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ inputs.github_token }}
        run: |
          git config user.name "uefibot"
          git config user.email "uefibot@microsoft.com"
          git add .
          git commit -m "Update BaseTools ext dep to ${{ steps.branch.outputs.version }}" -m "" -m "Signed-off-by: Project Mu UEFI Bot <uefibot@microsoft.com>"
          git push origin HEAD:refs/heads/sync-basetools/${{ inputs.tag_name }}
